<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="700" viewBox="0 0 1320 700" role="img" aria-labelledby="title desc">
  <title id="title">OpenCV CPU 与 CV-CUDA MUSA Top speedups 吞吐量对比</title>
  <desc id="desc">Grouped bar chart comparing OpenCV CPU and CV-CUDA MUSA throughput in images per millisecond for the top ten speedup benchmark cases. The y-axis uses a logarithmic scale.</desc>
  <style><![CDATA[
    text{font-family:Arial,"Source Han Sans CN","Noto Sans CJK SC",sans-serif;fill:#0b0b0b}
    .title{font-size:24px;font-weight:700}
    .subtitle{font-size:13px;fill:#52514e}
    .axis{stroke:#c3c2b7;stroke-width:1}
    .grid{stroke:#e1e0d9;stroke-width:1}
    .surface{fill:#fcfcfb;stroke:#c3c2b7;stroke-width:1}
    .cpu{fill:#1f77b4}
    .musa{fill:#f28e2b}
    .label{font-size:10.5px;fill:#0b0b0b}
    .tick{font-size:11px;fill:#52514e}
    .legend{font-size:13px;fill:#0b0b0b}
    .speed{font-size:11px;font-weight:700;fill:#0b0b0b}
    .value{font-size:10px;fill:#52514e}
    .note{font-size:11px;fill:#52514e}
  ]]></style>
  <rect width="100%" height="100%" fill="#fcfcfb"/>
  <text class="title" x="82" y="36">OpenCV CPU 与 CV-CUDA MUSA Top Speedups 吞吐量对比</text>
  <text class="subtitle" x="82" y="60">输入规格：1x1080x1920，BatchSize=1；纵轴为 images/ms（对数坐标），数值越高越好。</text>
  <rect x="910" y="29" width="16" height="11" rx="2" class="cpu"/><text class="legend" x="932" y="39">OpenCV CPU</text>
  <rect x="1045" y="29" width="16" height="11" rx="2" class="musa"/><text class="legend" x="1067" y="39">CV-CUDA MUSA</text>

  <rect class="surface" x="82" y="92" width="1168" height="418"/>

  <line class="grid" x1="82" y1="510.0" x2="1250" y2="510.0"/><text class="tick" x="72" y="514" text-anchor="end">0.01</text>
  <line class="grid" x1="82" y1="475.8" x2="1250" y2="475.8"/><text class="tick" x="72" y="479.8" text-anchor="end">0.02</text>
  <line class="grid" x1="82" y1="430.8" x2="1250" y2="430.8"/><text class="tick" x="72" y="434.8" text-anchor="end">0.05</text>
  <line class="grid" x1="82" y1="396.7" x2="1250" y2="396.7"/><text class="tick" x="72" y="400.7" text-anchor="end">0.1</text>
  <line class="grid" x1="82" y1="362.6" x2="1250" y2="362.6"/><text class="tick" x="72" y="366.6" text-anchor="end">0.2</text>
  <line class="grid" x1="82" y1="317.6" x2="1250" y2="317.6"/><text class="tick" x="72" y="321.6" text-anchor="end">0.5</text>
  <line class="grid" x1="82" y1="283.5" x2="1250" y2="283.5"/><text class="tick" x="72" y="287.5" text-anchor="end">1</text>
  <line class="grid" x1="82" y1="249.4" x2="1250" y2="249.4"/><text class="tick" x="72" y="253.4" text-anchor="end">2</text>
  <line class="grid" x1="82" y1="204.4" x2="1250" y2="204.4"/><text class="tick" x="72" y="208.4" text-anchor="end">5</text>
  <line class="grid" x1="82" y1="170.3" x2="1250" y2="170.3"/><text class="tick" x="72" y="174.3" text-anchor="end">10</text>
  <line class="grid" x1="82" y1="136.2" x2="1250" y2="136.2"/><text class="tick" x="72" y="140.2" text-anchor="end">20</text>
  <line class="grid" x1="82" y1="92.0" x2="1250" y2="92.0"/><text class="tick" x="72" y="96" text-anchor="end">50</text>
  <line class="axis" x1="82" y1="510" x2="1250" y2="510"/>
  <text class="tick" x="20" y="301" text-anchor="middle" transform="rotate(-90 20 301)">吞吐量（images/ms, log scale）</text>

  <g transform="translate(0,0)">
    <rect class="cpu" x="113.4" y="498.4" width="22" height="11.6" rx="3"/>
    <rect class="musa" x="143.4" y="204.0" width="22" height="306.0" rx="3"/>
    <text class="speed" x="154.4" y="196.0" text-anchor="middle">392.81x</text>
    <text class="value" x="154.4" y="220.0" text-anchor="middle">4.96</text>
    <text class="label" x="154.4" y="530" text-anchor="end" transform="rotate(-42 154.4 530)">WarpPerspective U8</text>
  </g>
  <g>
    <rect class="cpu" x="227.2" y="485.7" width="22" height="24.3" rx="3"/>
    <rect class="musa" x="257.2" y="202.5" width="22" height="307.5" rx="3"/>
    <text class="speed" x="268.2" y="194.5" text-anchor="middle">311.85x</text>
    <text class="value" x="268.2" y="218.5" text-anchor="middle">5.10</text>
    <text class="label" x="268.2" y="530" text-anchor="end" transform="rotate(-42 268.2 530)">WarpPerspective F32</text>
  </g>
  <g>
    <rect class="cpu" x="341.0" y="498.2" width="22" height="11.8" rx="3"/>
    <rect class="musa" x="371.0" y="225.0" width="22" height="285.0" rx="3"/>
    <text class="speed" x="382.0" y="217.0" text-anchor="middle">255.41x</text>
    <text class="value" x="382.0" y="241.0" text-anchor="middle">3.23</text>
    <text class="label" x="382.0" y="530" text-anchor="end" transform="rotate(-42 382.0 530)">WarpAffine F32</text>
  </g>
  <g>
    <rect class="cpu" x="454.8" y="396.2" width="22" height="113.8" rx="3"/>
    <rect class="musa" x="484.8" y="152.1" width="22" height="357.9" rx="3"/>
    <text class="speed" x="495.8" y="144.1" text-anchor="middle">140.89x</text>
    <text class="value" x="495.8" y="168.1" text-anchor="middle">14.18</text>
    <text class="label" x="495.8" y="530" text-anchor="end" transform="rotate(-42 495.8 530)">Rotate U8</text>
  </g>
  <g>
    <rect class="cpu" x="568.6" y="407.9" width="22" height="102.1" rx="3"/>
    <rect class="musa" x="598.6" y="166.4" width="22" height="343.6" rx="3"/>
    <text class="speed" x="609.6" y="158.4" text-anchor="middle">133.92x</text>
    <text class="value" x="609.6" y="182.4" text-anchor="middle">10.63</text>
    <text class="label" x="609.6" y="530" text-anchor="end" transform="rotate(-42 609.6 530)">Resize F32</text>
  </g>
  <g>
    <rect class="cpu" x="682.4" y="471.0" width="22" height="39.0" rx="3"/>
    <rect class="musa" x="712.4" y="233.4" width="22" height="276.6" rx="3"/>
    <text class="speed" x="723.4" y="225.4" text-anchor="middle">123.90x</text>
    <text class="value" x="723.4" y="249.4" text-anchor="middle">2.73</text>
    <text class="label" x="723.4" y="530" text-anchor="end" transform="rotate(-42 723.4 530)">WarpAffine U8</text>
  </g>
  <g>
    <rect class="cpu" x="796.2" y="459.3" width="22" height="50.7" rx="3"/>
    <rect class="musa" x="826.2" y="235.3" width="22" height="274.7" rx="3"/>
    <text class="speed" x="837.2" y="227.3" text-anchor="middle">93.93x</text>
    <text class="value" x="837.2" y="251.3" text-anchor="middle">2.62</text>
    <text class="label" x="837.2" y="530" text-anchor="end" transform="rotate(-42 837.2 530)">BilateralFilter F32</text>
  </g>
  <g>
    <rect class="cpu" x="910.0" y="398.5" width="22" height="111.5" rx="3"/>
    <rect class="musa" x="940.0" y="186.5" width="22" height="323.5" rx="3"/>
    <text class="speed" x="951.0" y="178.5" text-anchor="middle">73.46x</text>
    <text class="value" x="951.0" y="202.5" text-anchor="middle">7.06</text>
    <text class="label" x="951.0" y="530" text-anchor="end" transform="rotate(-42 951.0 530)">Remap U8</text>
  </g>
  <g>
    <rect class="cpu" x="1023.8" y="316.1" width="22" height="193.9" rx="3"/>
    <rect class="musa" x="1053.8" y="108.8" width="22" height="401.2" rx="3"/>
    <text class="speed" x="1064.8" y="100.8" text-anchor="middle">66.78x</text>
    <text class="value" x="1064.8" y="124.8" text-anchor="middle">34.19</text>
    <text class="label" x="1064.8" y="530" text-anchor="end" transform="rotate(-42 1064.8 530)">Threshold F32 TOZERO_INV</text>
  </g>
  <g>
    <rect class="cpu" x="1137.6" y="326.1" width="22" height="183.9" rx="3"/>
    <rect class="musa" x="1167.6" y="119.7" width="22" height="390.3" rx="3"/>
    <text class="speed" x="1178.6" y="111.7" text-anchor="middle">65.57x</text>
    <text class="value" x="1178.6" y="135.7" text-anchor="middle">27.40</text>
    <text class="label" x="1178.6" y="530" text-anchor="end" transform="rotate(-42 1178.6 530)">Threshold F32 TRUNC</text>
  </g>

  <text class="note" x="82" y="640">注：images/ms 按 1 / 单次处理耗时 ms 换算，表示固定输入规格 1x1080x1920 下每毫秒可完成的算子处理次数，不等同于端到端图片 FPS。</text>
  <text class="note" x="82" y="660">OpenCV CPU 耗时为 CPU wall time；CV-CUDA MUSA 吞吐量基于 GPU event time 换算。数据来自摩尔线程实验室。</text>
</svg>
