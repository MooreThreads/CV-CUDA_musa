<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="680" viewBox="0 0 1380 680" role="img" aria-labelledby="title desc">
<title id="title">Highlighted OpenCV CPU, CV-CUDA MUSA, and CV-CUDA CUDA throughput cases</title>
<desc id="desc">Grouped bar chart comparing OpenCV CPU throughput, CV-CUDA MUSA GPU throughput, and CV-CUDA CUDA GPU throughput in images per millisecond for selected benchmark cases.</desc>
<style><![CDATA[
  text{font-family:Arial,"Source Han Sans CN","Noto Sans CJK SC",sans-serif;fill:#0b0b0b}
  .title{font-size:24px;font-weight:700}
  .subtitle{font-size:13px;fill:#52514e}
  .axis{stroke:#c3c2b7;stroke-width:1}
  .grid{stroke:#e1e0d9;stroke-width:1}
  .surface{fill:#fcfcfb;stroke:#c3c2b7;stroke-width:1}
  .opencv{fill:#1f77b4}
  .musa{fill:#f28e2b}
  .cuda{fill:#76b900}
  .label{font-size:10.5px;fill:#0b0b0b}
  .tick{font-size:11px;fill:#52514e}
  .speed{font-size:11px;font-weight:700;fill:#0b0b0b}
  .legend{font-size:13px;fill:#0b0b0b}
  .note{font-size:11px;fill:#52514e}
]]></style>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text class="title" x="80" y="34">OpenCV CPU、CV-CUDA MUSA 与 CV-CUDA CUDA 吞吐量对比</text>
<text class="subtitle" x="80" y="58">1x1080x1920 单图输入；纵轴为 images/ms（对数坐标），数值越高越好。</text>
